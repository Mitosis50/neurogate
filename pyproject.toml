[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurogate"
version = "0.1.0"
description = "Open compliance & rights toolkit for neural data - benchmarks + governance for democratized BCI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Elbert Basa"}, {name = "Mira (AI co-maintainer)"}]
keywords = ["neurodata", "bci", "governance", "privacy", "nwb", "spikeinterface", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
nwb = ["pynwb>=2.6"]
spikes = ["spikeinterface>=0.100"]
dev = ["pytest>=8"]

[project.scripts]
neurogate = "neurogate.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
